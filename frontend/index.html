<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - Sign In</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 class="brand-title">Student Portal</h1>
      <h2 class="section-title">Sign In</h2>

      <form class="form" action="./home.html" method="get">
        <label for="rollNumber">Roll No.</label>
        <input
          id="rollNumber"
          name="rollNumber"
          type="text"
          placeholder="Enter Roll Number (17I-1234)"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter Password"
          required
        />

        <button type="submit" class="btn-signin">Sign In</button>
      </form>
    </section>
  </main>
</body>
</html>
