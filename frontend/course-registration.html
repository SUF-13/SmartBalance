<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - Course Registration</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="app-shell-body">
  <div class="app-shell">
    <aside class="sidebar">
      <h1 class="sidebar-title">Student Portal</h1>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="./home.html">Home</a>
        <a class="sidebar-link active" href="./course-registration.html">Course Registration</a>
        <a class="sidebar-link" href="./analytics.html">Server Analytics</a>
      </nav>
      <button id="logoutBtn" class="sidebar-logout">Logout</button>
    </aside>

    <main class="content">
      <header class="content-header">
        <h2>Course Registration</h2>
      </header>

      <section class="tab-container">
        <div class="tabs">
          <button class="tab-btn active" data-tab="student-info">Student Info</button>
          <button class="tab-btn" data-tab="courses-available">Courses Available</button>
          <button class="tab-btn" data-tab="courses-registered">Courses Registered</button>
        </div>

        <div class="tab-panel active" id="student-info">
          <div class="student-info-box" id="studentInfo"></div>
        </div>

        <div class="tab-panel" id="courses-available">
          <div class="table-top-actions">
            <select id="deptFilter" class="analytics-select">
              <option value="">All Departments</option>
            </select>
            <button id="checkSelectedButton" class="btn-check">Check Selected</button>
            <button id="registerButton" class="btn-register">Register</button>
          </div>
          <p id="selectionSummary" class="selection-summary">No course selected.</p>
          <div class="table-wrap">
            <table class="portal-table">
              <thead>
                <tr>
                  <th>Check</th>
                  <th>Sr.#</th>
                  <th>Course Name</th>
                  <th>Cr.Hrs</th>
                  <th>Relation</th>
                  <th>Status</th>
                  <th>Section</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="7">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="tab-panel" id="courses-registered">
          <div class="table-wrap">
            <table class="portal-table registered-table">
              <thead>
                <tr>
                  <th>Sr.#</th>
                  <th>Course Code</th>
                  <th>Course Name</th>
                  <th>Cr.Hrs</th>
                  <th>Relation</th>
                  <th>Status</th>
                  <th>Section</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="registeredCoursesBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";
    const authHeaders = () => {
      const token = localStorage.getItem("token");
      return token ? { Authorization: `Bearer ${token}` } : {};
    };
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels = document.querySelectorAll(".tab-panel");
    const studentId = localStorage.getItem("student_id") || "DEMO-STUDENT";
    let selectedCourseIds = [];
    let registeredCourseIds = new Set();
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("student_id");
      localStorage.removeItem("token");
      window.location.href = "./index.html";
    });


    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const targetTab = button.dataset.tab;

        tabButtons.forEach((btn) => btn.classList.remove("active"));
        tabPanels.forEach((panel) => panel.classList.remove("active"));

        button.classList.add("active");
        document.getElementById(targetTab).classList.add("active");
      });
    });

    function renderStudentInfo(studentInfo) {
      const fieldOrder = [
        ["name", "Name"],
        ["roll_number", "Roll Number"],
        ["program", "Program"],
        ["batch", "Batch"],
        ["section", "Section"],
        ["course_limit_for_semester", "Course Limit for Semester"],
        ["registered_courses", "Registered Courses"],
        ["registered_credits", "Registered Credits"],
        ["semester", "Semester"],
        ["warning_count", "Warning Count"],
        ["credits_earned", "Credits Earned"],
        ["credits_attempted", "Credits Attempted"],
        ["cgpa", "CGPA"],
      ];

      document.getElementById("studentInfo").innerHTML = fieldOrder
        .map(([key, label]) => `<p><strong>${label}:</strong> ${studentInfo[key] ?? "-"}</p>`)
        .join("");
    }

    function makeAvailableRow(course) {
      const sectionOptions = (course.sections || [])
        .map((section) => `<option value="${section}">${section}</option>`)
        .join("");

      return `
        <tr class="row-available">
          <td>
            <input type="checkbox" class="course-check" data-course-id="${course.course_id}" />
          </td>
          <td>${course.sr}</td>
          <td>${course.course_name}</td>
          <td>${course.cr_hrs}</td>
          <td>${course.relation}</td>
          <td>${course.status}</td>
          <td>
            <select class="section-select" data-course-id="${course.course_id}">
              ${sectionOptions}
            </select>
          </td>
        </tr>
      `;
    }

    function renderAvailableCourses(data) {
      const tableBody = document.querySelector("#courses-available tbody");
      const offeredRows = data.courses_available
        .filter((course) => !registeredCourseIds.has(course.course_id))
        .map(makeAvailableRow)
        .join("");
      const improvementRows = data.improvement_courses
        .filter((course) => !registeredCourseIds.has(course.course_id))
        .map(makeAvailableRow)
        .join("");
      const improvementBlock = data.improvement_courses.length
        ? `<tr class="improvement-row"><td colspan="7">Improvement Courses</td></tr>${improvementRows}`
        : "";

      tableBody.innerHTML = offeredRows + improvementBlock;

      selectedCourseIds = [];
      renderSelectionSummary();
      tableBody.querySelectorAll(".course-check").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const courseId = checkbox.dataset.courseId;
          if (checkbox.checked) {
            if (!selectedCourseIds.includes(courseId)) {
              selectedCourseIds.push(courseId);
            }
          } else {
            selectedCourseIds = selectedCourseIds.filter((id) => id !== courseId);
          }
          renderSelectionSummary();
        });
      });
    }

    function renderSelectionSummary() {
      const summary = document.getElementById("selectionSummary");
      summary.textContent = selectedCourseIds.length
        ? `${selectedCourseIds.length} course(s) checked for registration.`
        : "No course selected.";
    }

    function renderRegisteredCourses(data) {
      const body = document.getElementById("registeredCoursesBody");
      registeredCourseIds = new Set((data.courses_registered || []).map((course) => course.course_code));
      body.innerHTML = data.courses_registered
        .map(
          (course) => `
          <tr class="row-registered">
            <td>${course.sr}</td>
            <td>${course.course_code}</td>
            <td>${course.course_name}</td>
            <td>${course.cr_hrs}</td>
            <td>${course.relation}</td>
            <td>${course.status}</td>
            <td>${course.section}</td>
            <td>
              <button class="btn-drop" data-course-id="${course.course_code}">Drop</button>
            </td>
          </tr>
        `
        )
        .join("");

      body.querySelectorAll(".btn-drop").forEach((button) => {
        button.addEventListener("click", async () => {
          const courseId = button.dataset.courseId;
          const ok = window.confirm(`Drop ${courseId}?`);
          if (!ok) {
            return;
          }
          try {
            const response = await fetch(`${API_BASE}/drop`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                ...authHeaders(),
              },
              // Backend derives student identity from JWT.
              body: JSON.stringify({ course_id: courseId }),
            });
            const result = await response.json();
            if (!response.ok) {
              throw new Error(result.error || "Drop failed.");
            }
            window.alert("Course dropped successfully.");
            await fetchRegistrationData();
          } catch (error) {
            window.alert(error.message);
          }
        });
      });
    }

    async function fetchRegistrationData() {
      const response = await fetch(
        `${API_BASE}/student/registration-data?student_id=${encodeURIComponent(studentId)}`
      );
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Failed to load registration data.");
      }
      renderStudentInfo(data.student_info);
      renderRegisteredCourses(data);
      renderAvailableCourses(data);
    }

    async function loadDepartmentFilter() {
      try {
        const response = await fetch(`${API_BASE}/departments`);
        const data = await response.json();
        if (!response.ok) {
          return;
        }
        const filter = document.getElementById("deptFilter");
        filter.innerHTML =
          `<option value="">All Departments</option>` +
          (data.departments || [])
            .map((dept) => `<option value="${dept.dept_id}">${dept.dept_name}</option>`)
            .join("");

        filter.addEventListener("change", async () => {
          const deptId = filter.value;
          if (!deptId) {
            await fetchRegistrationData();
            return;
          }
          const coursesResponse = await fetch(`${API_BASE}/courses?dept_id=${encodeURIComponent(deptId)}`);
          const coursesData = await coursesResponse.json();
          if (!coursesResponse.ok) {
            return;
          }
          const synthetic = {
            courses_available: (coursesData.courses || []).map((course, idx) => ({
              sr: idx + 1,
              course_id: course.course_id,
              course_name: course.course_name,
              cr_hrs: course.credit_hours,
              relation: "Core",
              status: "Not Registered",
              sections: ["RCS-6A", "RCS-6B", "RCS-6C"],
            })),
            improvement_courses: [],
          };
          renderAvailableCourses(synthetic);
        });
      } catch (error) {
        // Keep existing functionality even if departments endpoint fails.
      }
    }

    const registerButton = document.getElementById("registerButton");
    const checkButton = document.getElementById("checkSelectedButton");

    checkButton.addEventListener("click", () => {
      if (!selectedCourseIds.length) {
        window.alert("Please check at least one course.");
        return;
      }
      window.alert(
        `Checked courses: ${selectedCourseIds.join(", ")}`
      );
    });

    registerButton.addEventListener("click", async () => {
      if (!selectedCourseIds.length) {
        window.alert("Please check at least one course.");
        return;
      }

      const shouldRegister = window.confirm("Are you sure you want to register?");
      if (!shouldRegister) {
        return;
      }

      try {
        for (const courseId of selectedCourseIds) {
          const response = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...authHeaders(),
            },
            // Backend derives student identity from JWT.
            body: JSON.stringify({ course_id: courseId }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || `Registration failed for ${courseId}.`);
          }
        }
        window.alert("Registration request submitted for checked courses.");
        setTimeout(fetchRegistrationData, 500);
      } catch (error) {
        window.alert(error.message);
      }
    });

    Promise.all([fetchRegistrationData(), loadDepartmentFilter()]).catch((error) => {
      document.getElementById("studentInfo").innerHTML =
        `<p class="status-text">${error.message}</p>`;
    });
  </script>
</body>
</html>
