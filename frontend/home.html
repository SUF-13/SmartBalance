<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - Home</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="app-shell-body">
  <div class="app-shell">
    <aside class="sidebar">
      <h1 class="sidebar-title">Student Portal</h1>
      <nav class="sidebar-nav">
        <a class="sidebar-link active" href="./home.html">Home</a>
        <a class="sidebar-link" href="./course-registration.html">Course Registration</a>
        <a class="sidebar-link" href="./analytics.html">Server Analytics</a>
      </nav>
      <button id="logoutBtn" class="sidebar-logout">Logout</button>
    </aside>

    <main class="content">
      <header class="content-header">
        <h2>Home Page</h2>
      </header>

      <section class="info-grid">
        <article class="info-card">
          <div class="info-card-title">University Information</div>
          <div class="info-card-body" id="universityInformation"></div>
        </article>

        <article class="info-card">
          <div class="info-card-title">Academic Calendar</div>
          <div class="info-card-body" id="academicCalendar"></div>
        </article>

        <article class="info-card">
          <div class="info-card-title">Personal Information</div>
          <div class="info-card-body" id="personalInformation"></div>
        </article>

        <article class="info-card">
          <div class="info-card-title">Contact Information</div>
          <div class="info-card-body" id="contactInformation"></div>
        </article>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";

    const toLine = (label, value) =>
      `<p><strong>${label}:</strong> ${value ?? "-"}</p>`;

    function renderMap(elementId, data, labels) {
      const element = document.getElementById(elementId);
      element.innerHTML = labels
        .map(([key, label]) => toLine(label, data?.[key]))
        .join("");
    }

    async function loadHome() {
      const studentId = localStorage.getItem("student_id") || "DEMO-STUDENT";
      try {
        const response = await fetch(
          `${API_BASE}/student/home?student_id=${encodeURIComponent(studentId)}`
        );
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Failed to load home data.");
        }

        renderMap("universityInformation", data.university_information, [
          ["roll_number", "Roll Number"],
          ["degree", "Degree"],
          ["batch", "Batch"],
          ["section", "Section"],
          ["campus", "Campus"],
        ]);
        renderMap("academicCalendar", data.academic_calendar, [
          ["registration", "Registration"],
          ["classes", "Classes"],
          ["online_withdrawal_request", "Online Withdrawal Request"],
        ]);
        renderMap("personalInformation", data.personal_information, [
          ["name", "Name"],
          ["gender", "Gender"],
          ["email", "Email"],
          ["dob", "DOB"],
          ["cnic", "CNIC"],
          ["mobile_no", "Mobile No"],
          ["blood_group", "Blood Group"],
          ["nationality", "Nationality"],
        ]);
        renderMap("contactInformation", data.contact_information, [
          ["address", "Address"],
          ["home_phone", "Home Phone"],
          ["postal_code", "Postal Code"],
          ["city", "City"],
          ["country", "Country"],
        ]);
      } catch (error) {
        document.getElementById("universityInformation").innerHTML =
          `<p class="status-text">${error.message}</p>`;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("student_id");
      localStorage.removeItem("token");
      window.location.href = "./index.html";
    });

    loadHome();
  </script>
</body>
</html>
